name: Build CV and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF renderer
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate CV PDF
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:1800},deviceScaleFactor:1});
            await page.goto('file://' + process.cwd() + '/site/cv.html', {waitUntil:'networkidle'});
            await page.pdf({
              path:'site/assets/Ahmed_Ifhaam_CV.pdf',
              format:'A4',
              printBackground:true,
              margin:{top:'12mm',right:'12mm',bottom:'12mm',left:'12mm'}
            });
            await browser.close();
          })();
          NODE

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/Ahmed_Ifhaam_CV.pdf
          git diff --cached --quiet || git commit -m "build: update CV PDF"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
